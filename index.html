<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caracteres</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <h1>Contador de caracteres</h1>

    <p>Escribe un texto máximo de 100 caracteres:</p>

    <textarea id="texto" maxlength="100" placeholder="Escribe aquí..."></textarea>

    <p id="contador">0 / 100 caracteres</p>

    <script src="script.js"></script>

</body>

</html>
